name: test

# 这个插件的回归故障长什么样：不是崩溃，是「文档写着有、代码在跑、产物是空的，而且不报错」。
# lib/index.js 没有构建步骤，改完就是生效版本，所以每次改都得跑一遍。
# 手跑会漏 —— 一天四个版本的时候一定会漏，这就是这个 workflow 唯一存在的理由。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是 package.json engines 的下限，24 是当前版本，两头都钉住
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # 仓库里没有 lockfile，setup-node 的 npm 缓存会因找不到 lock 直接失败，所以不启用

      - name: 安装依赖
        # peerDependencies 里的 @deepseek-ai/dsh-tools 由 npm 7+ 自动带上；
        # 干净机器上这一句是唯一需要联网的步骤，约 20 秒
        run: npm install --no-audit --no-fund

      - name: 语法检查
        # 没有 tsc 兜底，一万多行单文件的笔误只能靠这一句
        run: node --check lib/index.js

      - name: 文档与版本一致
        run: node .github/scripts/check-docs.mjs

      - name: 自检
        run: npm test

      - name: 端到端探针
        # 68 个脚本（62 探针 + 6 场景），每个独立建库、跑完自己删；harness.mjs 是脚手架不是用例。
        # 不 fail-fast：一次把坏的全看完，比修一个跑一次快。
        #
        # 失败的探针名要**不登录也能看见**：`::error` 会写成注解，而注解是公开可读的
        # （GET /repos/{owner}/{repo}/check-runs/{id}/annotations），日志本身要管理员权限。
        # 0.2.72 那次红，就是因为只能看到「某一步失败」，只能按「Linux 和 Windows 差在
        # 哪里」硬猜——猜了三轮才对上。注解里带上探针名和它自己的 FAIL 行，以后一眼定位。
        run: |
          fail=0
          for f in loom-e2e/*.mjs; do
            case "$f" in */harness.mjs) continue;; esac
            log="$(mktemp)"
            printf '\n── %s\n' "$f"
            if node "$f" > "$log" 2>&1; then
              tail -n 1 "$log"
            else
              fail=1
              cat "$log"
              detail="$(grep -a -m3 -F 'FAIL' "$log" | sed 's/^[[:space:]]*//' | tr '\n' '|' | sed 's/%/%25/g; s/|[|]*$//' | cut -c1-800)"
              [ -n "$detail" ] || detail="$(tail -n 3 "$log" | sed 's/^[[:space:]]*//' | tr '\n' '|' | sed 's/%/%25/g; s/|[|]*$//' | cut -c1-800)"
              echo "::error file=$f,title=探针失败：$(basename "$f")::$detail"
            fi
            rm -f "$log"
          done
          exit "$fail"
